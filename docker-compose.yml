services:
  api-nestjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api-nestjs
    restart: unless-stopped
    env_file:
      - /opt/taskflow/.env.nestjs
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-nestjs.rule=Host(`${TRAEFIK_DOMAIN:-localhost}`)"
      - "traefik.http.routers.api-nestjs.entrypoints=websecure"
      - "traefik.http.routers.api-nestjs.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-nestjs.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true