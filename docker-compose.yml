services:
  api-nestjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api-nestjs
    restart: unless-stopped
    env_file:
      - /opt/taskflow/.env.nestjs
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-nestjs.rule=Host(`taskflow-api-nest.xprad.com`)"
      - "traefik.http.routers.api-nestjs.entrypoints=websecure"
      - "traefik.http.routers.api-nestjs.tls.certresolver=lets-encrypt"
      - "traefik.http.services.api-nestjs.loadbalancer.server.port=3000"
      - "traefik.http.routers.api-nestjs.middlewares=secHeaders@file"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://localhost:3000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - public

networks:
  public:
    external: true