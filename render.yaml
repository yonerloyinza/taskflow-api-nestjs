services:
  - type: web
    name: taskflow-api-nestjs
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: CORS_ORIGIN
        value: https://onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false